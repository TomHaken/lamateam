name: Bug report
description: The Todoist API or the test framework does not behave as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste the API token.** Check logs, traces and screenshots for `Authorization` headers before attaching them.
  - type: dropdown
    id: area
    attributes:
      label: Where is the bug
      options:
        - Todoist API (application under test)
        - Test framework (clients, fixtures, reporters, CI)
    validations:
      required: true
  - type: input
    id: tc-id
    attributes:
      label: Related test case
      placeholder: TC-003
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      placeholder: POST /api/v1/tasks
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Status code and response body (redacted).
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: CI run or test report link
  - type: checkboxes
    id: no-token
    attributes:
      label: Security
      options:
        - label: I checked that nothing here contains the API token
          required: true
